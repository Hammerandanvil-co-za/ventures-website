name: Fix homepage sections

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-homepage.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  transform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Write and run transform script
        run: |
          cat > transform.py << 'PYEOF'
          import re
          import sys

          with open('src/app/page.tsx' if len(sys.argv) < 2 else sys.argv[1]) as f:
              content = f.read()

          orig_len = len(content)

          def find_div_open_start(content, cid_marker):
              """Given a marker like data-cid="n335", find the start index of the enclosing <div...> tag."""
              idx = content.index(cid_marker)
              start = content.rindex('<div', 0, idx)
              end = content.index('>', idx) + 1
              return start, end

          def find_matching_close(content, tag_start):
              """Given the start index of a <div...> opening tag, find the index right after its matching </div>."""
              depth = 0
              i = tag_start
              div_open_re = re.compile(r'<div\b[^>]*?(/?)>')
              while i < len(content):
                  m = div_open_re.match(content, i)
                  if m:
                      if m.group(1) != '/':
                          depth += 1
                      i = m.end()
                      if depth == 0:
                          raise RuntimeError("depth hit 0 unexpectedly on open")
                      continue
                  if content.startswith('</div>', i):
                      depth -= 1
                      i += len('</div>')
                      if depth == 0:
                          return i
                      continue
                  i += 1
              raise RuntimeError("never matched")

          # --- Edit 1: Remove Blog + Team combined section (data-cid="n335") ---
          start, tag_end = find_div_open_start(content, 'data-cid="n335"')
          close_end = find_matching_close(content, start)
          removed_1 = content[start:close_end]
          content = content[:start] + content[close_end:]
          print("Edit 1 (Blog+Team) removed", len(removed_1), "chars")

          # --- Edit 2: Replace FeatureCard grid wrapper (data-cid="n134") with new 4-block grid ---
          start, tag_end = find_div_open_start(content, 'data-cid="n134"')
          close_end = find_matching_close(content, start)
          removed_2 = content[start:close_end]
          new_grid = '''<div className="w-187 flex relative px-[0.7rem] items-stretch [background-position:50%_50%] max-md:w-[21.0375rem] max-md:px-[0.2125rem] max-lg:flex-wrap md:max-lg:w-[689.3px] md:max-lg:px-[6.9px] 2xl:w-[56.1rem] 2xl:px-[13.5px] after:content-[''] after:block after:w-0 after:h-0" data-cid="n134">
                                  <div className="flex relative flex-col justify-center grow" data-cid="n135">
                                    <div className="min-h-px block" data-cid="n136">
                                      <div className="flex flex-wrap gap-6" data-cid="n140">
                                        <a className="group flex-1 min-w-55 block relative p-8.5 rounded-[10px] overflow-hidden text-background bg-primary" data-component="link" href="https://energy.hammerandanvil.co.za" target="_blank" rel="noopener noreferrer">
                                          <h4 className="block [font-family:'Cantata_One'] text-[1.5rem] max-md:text-[1.375rem]" data-component="heading">
                                            Energy Solutions
                                          </h4>
                                        </a>
                                        <a className="group flex-1 min-w-55 block relative p-8.5 rounded-[10px] overflow-hidden text-background bg-color-012" data-component="link" href="/our-services">
                                          <h4 className="block [font-family:'Cantata_One'] text-[1.5rem] max-md:text-[1.375rem]" data-component="heading">
                                            Real Estate
                                          </h4>
                                        </a>
                                        <a className="group flex-1 min-w-55 block relative p-8.5 rounded-[10px] overflow-hidden text-background bg-primary" data-component="link" href="/our-services">
                                          <h4 className="block [font-family:'Cantata_One'] text-[1.5rem] max-md:text-[1.375rem]" data-component="heading">
                                            Mining
                                          </h4>
                                        </a>
                                        <a className="group flex-1 min-w-55 block relative p-8.5 rounded-[10px] overflow-hidden text-background bg-color-012" data-component="link" href="/our-services">
                                          <h4 className="block [font-family:'Cantata_One'] text-[1.5rem] max-md:text-[1.375rem]" data-component="heading">
                                            IT & Software Development
                                          </h4>
                                        </a>
                                      </div>
                                    </div>
                                  </div>
                                </div>'''
          content = content[:start] + new_grid + content[close_end:]
          print("Edit 2 (FeatureCard grid) removed", len(removed_2), "chars, inserted", len(new_grid), "chars")

          # --- Edit 3: Remove paragraph + sectors list (data-cid="n114" through end of data-cid="n120" block) ---
          start_114, _ = find_div_open_start(content, 'data-cid="n114"')
          close_114 = find_matching_close(content, start_114)
          start_117, _ = find_div_open_start(content, 'data-cid="n117"')
          close_117 = find_matching_close(content, start_117)
          start_120, _ = find_div_open_start(content, 'data-cid="n120"')
          close_120 = find_matching_close(content, start_120)
          # these three blocks (n114, n117, n120) are siblings in sequence; remove from start_114 to close_120
          assert start_114 < start_117 < start_120, "unexpected ordering"
          removed_3 = content[start_114:close_120]
          content = content[:start_114] + content[close_120:]
          print("Edit 3 (paragraph+sectors) removed", len(removed_3), "chars")

          # --- Edit 4: Heading text change ---
          before = content
          content = content.replace('data-component="heading">\n                                  Our Services\n', 'data-component="heading">\n                                  Our Divisions\n', 1)
          assert content != before, "heading replace did not match"
          print("Edit 4 (heading) done")

          # --- Edit 5: Remove unused MediaCard/ListRow4/ListRow5 imports and const blocks ---
          for imp in ['import MediaCard from "./components/media-card";\n',
                      'import ListRow4 from "./components/list-row4";\n',
                      'import ListRow5 from "./components/list-row5";\n']:
              assert imp in content, f"import not found: {imp}"
              content = content.replace(imp, '', 1)

          def remove_const_block(content, name):
              pattern = re.compile(r'const ' + re.escape(name) + r'[^=]*= \[.*?\n\];\n', re.DOTALL)
              m = pattern.search(content)
              assert m, f"const block not found: {name}"
              return content[:m.start()] + content[m.end():]

          for name in ['MediaCard_data', 'ListRow4_data', 'ListRow5_data',
                       'MediaCard_cids', 'ListRow4_cids', 'ListRow5_cids',
                       'MediaCard_styles', 'ListRow4_styles', 'ListRow5_styles']:
              content = remove_const_block(content, name)
          print("Edit 5 (unused imports/consts) done")

          # --- Edit 6: Remove footer Categories + Recent Posts widgets ---
          start_579, _ = find_div_open_start(content, 'id="categories-1"')
          # the outer wrapper div is the one right before this; back up to find its <div ...> start
          # Actually id="categories-1" IS on an inner div; the OUTER wrapper div (data-cid="n578") wraps it
          start_wrap1, _ = find_div_open_start(content, 'data-cid="n578"')
          close_wrap1 = find_matching_close(content, start_wrap1)
          start_wrap2, _ = find_div_open_start(content, 'data-cid="n588"')
          close_wrap2 = find_matching_close(content, start_wrap2)
          assert start_wrap1 < close_wrap1 <= start_wrap2, "unexpected footer widget ordering"
          removed_6 = content[start_wrap1:close_wrap2]
          content = content[:start_wrap1] + content[close_wrap2:]
          print("Edit 6 (footer widgets) removed", len(removed_6), "chars")

          with open('page.transformed.tsx', 'w') as f:
              f.write(content)

          print("Final length:", len(content), "(was", orig_len, ")")

          PYEOF
          python3 transform.py src/app/page.tsx
          mv page.transformed.tsx src/app/page.tsx

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/app/page.tsx
          git diff --cached --quiet && echo "No changes" || git commit -m "Update homepage: rename to Our Divisions, trim service blocks, remove team/blog sections"
          git push origin main

